spring:
  application:
    name: booking-service

  config:
    import: "configserver:http://localhost:8888"

  cloud:
    config:
      label: main
    openfeign:
      client:
        config:
          event-service:
            connectTimeout: 2000
            readTimeout: 3000

  datasource:
    url: jdbc:h2:mem:bookingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
